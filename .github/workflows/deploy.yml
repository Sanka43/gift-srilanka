name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_mysql, gd, zip, curl
          tools: composer:v2

      - name: 🟢 Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: 🎨 Install NPM dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: 🔑 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: 🚀 Deploy via Rsync over SSH
        run: |
          rsync -avz --delete \
            --exclude="/node_modules" \
            --exclude="/.git" \
            --exclude="/.github" \
            --exclude="/.env" \
            --exclude="/storage" \
            --exclude="/tests" \
            --exclude="*.sql" \
            --exclude="*.dump" \
            --exclude="error_log" \
            --rsync-path="mkdir -p ${{ secrets.CPANEL_TARGET_PATH }} && rsync" \
            -e "ssh -p ${{ secrets.CPANEL_PORT || 22 }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:${{ secrets.CPANEL_TARGET_PATH }}

      - name: ⚡ Run Artisan & Optimization Commands on cPanel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script: |
            cd ${{ secrets.CPANEL_TARGET_PATH }}
            php artisan migrate --force
            php artisan storage:link
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan queue:restart || true
